scan:
  scanners:
    - vuln
    - license

license:
  severities:
    - CRITICAL
    - HIGH
license:
  ignored-licenses:
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - Apache-2.0
    - LGPL-2.1-or-later
    - LGPL-3.0-or-later
    - MPL-2.0
    - ISC
    - Zlib
    - 0BSD
    - GPL-2.0-or-later  # Ignore GPL-or-later if you only want to flag strict GPL-2.0/GPL-3.0
