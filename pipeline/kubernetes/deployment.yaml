---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-app
  namespace: novapay-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay
  template:
    metadata:
      labels:
        app: novapay
    spec:
      containers:
        - name: novapay-container
          image: novapay-app:latest
          ports:
            - containerPort: 80
